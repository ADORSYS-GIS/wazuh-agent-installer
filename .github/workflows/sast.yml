name: Static Application Security Testing (SAST)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  sbom:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sbom.yml@cdd423a0be84cfeb3a25221a30fc4c39da12ecb4
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read

  sast-rust:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-rust.yml@cdd423a0be84cfeb3a25221a30fc4c39da12ecb4
    with:
      runner: ubuntu-latest
      working-directory: "src-tauri"
      rust-version: "stable"
    permissions:
      contents: read
      actions: read
      checks: write

  sast-javascript-typescript:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-javascript-typescript.yml@cdd423a0be84cfeb3a25221a30fc4c39da12ecb4
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write

  sast-shell:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-shell.yml@cdd423a0be84cfeb3a25221a30fc4c39da12ecb4
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write

  sast-powershell:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-powershell.yml@cdd423a0be84cfeb3a25221a30fc4c39da12ecb4
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write

  secret-scan:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/secret-scan.yml@db2f1dbe7eb5efbcb06aa80ad3719fc1675c37bf
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
    secrets:
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
