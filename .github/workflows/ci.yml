name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Check on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'bust-cache-1'

      - name: Install CI tools
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4
        with:
          tool: cargo-machete, cargo-nextest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils

      - name: Check formatting
        working-directory: ./src-tauri
        run: cargo fmt --all --check

      - name: Clippy lints
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: ./src-tauri
        run: cargo nextest run --no-tests pass

      - name: Check unused dependencies
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: ./src-tauri
        run: cargo machete --with-metadata

      - name: Extract versions
        id: versions
        run: |
          pkg=$(jq -r '.version' package.json)
          cargo=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          tauri=$(jq -r '.version' src-tauri/tauri.conf.json)

          echo "package=$pkg"   >> "$GITHUB_OUTPUT"
          echo "cargo=$cargo"   >> "$GITHUB_OUTPUT"
          echo "tauri=$tauri"   >> "$GITHUB_OUTPUT"

          echo "package.json:        $pkg"
          echo "Cargo.toml:          $cargo"
          echo "tauri.conf.json:     $tauri"

      - name: Fail if versions differ
        run: |
          pkg="${{ steps.versions.outputs.package }}"
          cargo="${{ steps.versions.outputs.cargo }}"
          tauri="${{ steps.versions.outputs.tauri }}"

          if [ "$pkg" != "$cargo" ] || [ "$cargo" != "$tauri" ]; then
            echo "::error::Version mismatch! package.json=$pkg, Cargo.toml=$cargo, tauri.conf.json=$tauri"
            echo "All three files must have the same version string."
            exit 1
          fi

          echo "All versions match: $tauri"
