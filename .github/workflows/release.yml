name: Release

on:
  push:
    tags:
      - 'v*'   # triggers on any tag like v1.0.0, v1.2.3, etc.

jobs:
  build-tauri:
    permissions:
      contents: write   # needed to create the GitHub Release and upload assets

    strategy:
      fail-fast: false
      matrix:
        flavor: [prod, dev]
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: ubuntu-22.04-arm
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust ──────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            xdg-utils

      # ── Node ──────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Update versions from tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' and any pre-release suffix (e.g. v1.1.0-rc.1 → 1.1.0)
          CLEAN_VERSION="${TAG_NAME#v}"
          CLEAN_VERSION="${CLEAN_VERSION%%-*}"
          export CLEAN_VERSION
          export TAG_NAME
          echo "Setting version to: $CLEAN_VERSION (from tag: $TAG_NAME)"

          # Update package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.CLEAN_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update src-tauri/tauri.conf.json
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.env.CLEAN_VERSION;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

          # Update src-tauri/Cargo.toml
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            content = content.replace(/^version = \"[^\"]*\"/m, 'version = \"' + process.env.CLEAN_VERSION + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', content);
          "
          # Update src/config.ts
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('src/config.ts', 'utf8');
            content = content.replace(/appVersion:\s*\"[^\"]*\"/, 'appVersion: \"v' + process.env.CLEAN_VERSION + '\"');
            fs.writeFileSync('src/config.ts', content);
          "

      - name: Apply flavor settings
        if: matrix.flavor == 'dev'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.build.beforeBuildCommand = 'npm run build:dev';
            conf.productName = 'wazuh-agent-installer-dev';
            conf.identifier = 'com.adorsys.wazuh.dev';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      # ── Build & Release ───────────────────────────────────────────────────
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Wazuh Agent Installer ${{ github.ref_name }}'
          releaseBody: |
            ## Wazuh Agent Installer ${{ github.ref_name }}

            A guided desktop installer for the full Wazuh Agent security stack.

            ### What this installs
            - Wazuh Agent ${{ github.ref_name }}
            - wazuh-cert-oauth2-client
            - wazuh-agent-status
            - YARA integration
            - Suricata (IDS or IPS mode)
            - USB DLP active response scripts
            - Trivy (optional)

            ### Downloads
            | Platform | File |
            |---|---|
            | Linux | `.AppImage` or `.deb` |
            | macOS | `.dmg` (universal — Intel + Apple Silicon) |
            | Windows | `.msi` or `.exe` |

            ### Install
            - **Linux `.deb`**: `sudo dpkg -i wazuh-agent-installer_*.deb`
            - **Linux `.AppImage`**: `chmod +x *.AppImage && ./*.AppImage`
            - **macOS**: Open the `.dmg` and drag to Applications
            - **Windows**: Run the `.msi` installer
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
